# Cuts a release from a version tag: builds the NSIS installer, signs the updater
# artifacts with the minisign key, and drafts a GitHub release with the .exe, the
# .exe.sig and latest.json. Replaces the manual "To cut a release" steps in README.md.
#
# Secrets this needs:
#   TAURI_SIGNING_PRIVATE_KEY           contents of %USERPROFILE%\.tauri\alcove.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty string if none)
#
# The release is left as a DRAFT on purpose: the updater endpoint reads
# releases/latest, so nothing reaches existing installs until you publish it.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # build without releasing, to check the pipeline still works

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # ponytail: version lives in package.json and tauri.conf.json both. Catch the
      # drift here rather than in a release that ships the wrong number.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          crate=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$crate"
          test "$tag" = "$pkg" && test "$tag" = "$conf" && test "$tag" = "$crate"

      - run: npm run lint
      - run: npm run check

      # tauri-action bakes the release body into latest.json, which the updater
      # shows people in the update prompt. Left unset it is empty, and they get
      # asked to update with no reason given.
      - name: Take the release notes from the tag
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          notes=$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)')
          [ -n "$notes" ] || notes="See the commit history for what changed."
          { echo "body<<NOTES_EOF"; echo "$notes"; echo "NOTES_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Build and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Empty on a manual run, which makes tauri-action build without releasing.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Alcove {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          args: --bundles nsis

      # TODO: Authenticode signing goes HERE, once SignPath approves.
      # It has to run before the updater signature is made, or the .sig will not
      # match the shipped .exe. That means dropping tauri-action's one-shot build
      # for: build unsigned -> submit to SignPath -> `tauri signer sign` the signed
      # .exe -> upload. See signpath/github-action-submit-signing-request.

      - name: Attest what we just built
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: src-tauri/target/release/bundle/nsis/*-setup.exe

      # A manual run publishes nothing, so without this it leaves you no installer
      # to actually run before you trust a tag to the pipeline.
      - name: Keep the installer for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Alcove-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
