commands.allow = ["empty_recycle_bin"]

[[permission]]
identifier = "allow-recycle-bin-properties"
description = "Open Recycle Bin properties"
commands.allow = ["recycle_bin_properties"]

[[permission]]
identifier = "allow-paste-into-folder"
description = "Paste clipboard files onto the Desktop or into a folder"
commands.allow = ["paste_into_folder"]

[[permission]]
identifier = "allow-recycle-desktop-items"
description = "Send Desktop files to the Recycle Bin"
commands.allow = ["recycle_desktop_items"]

[[permission]]
identifier = "allow-desktop-background"
description = "Read the Windows desktop wallpaper and background color"
commands.allow = ["desktop_background"]

[[permission]]
identifier = "allow-set-windows-taskbar-hidden"
