[[permission]]
identifier = "allow-attach-to-desktop"
description = "Pin Alcove to the Windows desktop layer"
commands.allow = ["attach_to_desktop"]

[[permission]]
identifier = "allow-detach-from-desktop"
description = "Restore Explorer icons and show Alcove as a window"
commands.allow = ["detach_from_desktop"]

[[permission]]
identifier = "allow-desktop-attached"
description = "Read whether Alcove is pinned to the desktop"
commands.allow = ["desktop_attached"]

[[permission]]
identifier = "allow-list-desktop-icons"
description = "Read files and icons from the Windows Desktop folder"
commands.allow = ["list_desktop_icons"]

[[permission]]
identifier = "allow-list-folder-icons"
description = "Read files and icons from a chosen folder"
commands.allow = ["list_folder_icons"]

[[permission]]
identifier = "allow-shell-icon"
description = "Read the Windows icon for a system launcher target"
commands.allow = ["shell_icon"]

[[permission]]
identifier = "allow-thumbnail"
description = "Read a document's own thumbnail for the preview card"
commands.allow = ["thumbnail"]

[[permission]]
identifier = "allow-list-known-folders"
description = "List Windows known folders such as Downloads"
commands.allow = ["list_known_folders"]

[[permission]]
identifier = "allow-pick-folder"
description = "Open a folder picker"
commands.allow = ["pick_folder"]

[[permission]]
identifier = "allow-open-desktop-item"
description = "Open a Desktop file with its default app"
commands.allow = ["open_desktop_item"]

[[permission]]
identifier = "allow-recycle-bin"
