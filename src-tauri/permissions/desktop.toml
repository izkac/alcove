commands.allow = ["set_windows_taskbar_hidden"]

[[permission]]
identifier = "allow-windows-taskbar-hidden"
description = "Read whether the Windows taskbar is auto-hidden"
commands.allow = ["windows_taskbar_hidden"]

[[permission]]
identifier = "allow-list-running-windows"
description = "List open application windows for the taskbar"
commands.allow = ["list_running_windows"]

[[permission]]
identifier = "allow-activate-window"
description = "Focus or restore another application window"
commands.allow = ["activate_window"]

[[permission]]
identifier = "allow-focus-desktop"
description = "Bring the Alcove desktop window to the front"
commands.allow = ["focus_desktop"]

[[permission]]
identifier = "allow-show-search-window"
description = "Show the always-on-top icon search overlay"
commands.allow = ["show_search_window"]

[[permission]]
identifier = "allow-hide-search-window"
description = "Hide the icon search overlay"
commands.allow = ["hide_search_window"]

[[permission]]
identifier = "allow-autostart-enabled"
description = "Read whether Alcove starts when this user signs in"
commands.allow = ["autostart_enabled"]

[[permission]]
identifier = "allow-set-autostart"
description = "Turn sign-in startup on or off"
commands.allow = ["set_autostart"]

[[permission]]
identifier = "allow-this-desk"
description = "Read which monitor this Alcove window covers"
commands.allow = ["this_desk"]

[[permission]]
identifier = "allow-list-desks"
description = "List connected monitors for drawer assignment"
commands.allow = ["list_desks"]

[[permission]]
identifier = "allow-desk-hit"
